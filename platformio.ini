; PlatformIO project: the firmware of a GeekMagic SmallTV-Ultra (ESP-12F,
; ESP8266, 1.54" 240x240 ST7789 IPS). One image.
;
; Build:        pio run
; Artifact:     .pio/build/geekmagic/firmware.bin
; Flash:        upload firmware.bin in the web page (General → Software Update)
;               or over USB: pio run -t upload

[platformio]
default_envs = geekmagic

[env:geekmagic]
platform = espressif8266 @ 4.2.1
board = esp12e
framework = arduino

; 4 MB flash: 1 MB LittleFS (watch faces, settings, reminders), the rest for the
; sketch and its OTA copy.
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld

; gfx_tables_to_flash keeps 6.8 KB of the GFX library's unused JPEG tables out
; of RAM (see the script).
extra_scripts = pre:tools/gfx_tables_to_flash.py

monitor_speed = 115200
upload_speed = 921600

; The low-memory lwIP variant leaves more heap for the rendering and the web
; server; the JSON the device fetches is small.
build_flags =
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
	-D ARDUINOJSON_USE_DOUBLE=0

; Feature folders on the include path so cross-module quote-includes resolve.
; build_src_flags, not build_flags: a global -Isrc leaks into the framework build.
build_src_flags =
	-iquote src
	-iquote src/features/notify
	-iquote src/features/calendar
	-iquote src/features/reminders
	-iquote src/features/weather
	-iquote src/features/timer
	-iquote src/features/pomodoro
	-iquote src/features/currency
	-iquote src/features/nightstand

; Pinned exactly: a library release goes into the image, so a version change is
; a reviewed commit.
lib_deps =
	; 7.3 or newer: ThemeCatalog.h relies on JsonString(text, true) keeping
	; only a pointer; 7.2 reads that `true` as a length of 1.
	bblanchon/ArduinoJson @ 7.4.3
	moononournation/GFX Library for Arduino @ 1.6.9
